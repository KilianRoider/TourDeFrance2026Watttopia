name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:assembleDebug 2>&1 | tee build.log

      # Compiler errors as annotations and as a commit comment, so they can be read without the raw log.
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |What went wrong|^> Task .* FAILED|^\* What|tests completed" build.log | head -200 > errors.txt || true
          head -10 errors.txt | while IFS= read -r line; do echo "::error::${line}"; done
          {
            echo "Build ${{ github.run_number }} fehlgeschlagen (Run ${{ github.run_id }})."
            echo
            echo '```'
            cat errors.txt
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wattwerk.apk

      # On main, publish every build as a numbered release (kept) and as "latest" (always the newest APK).
      - name: Publish releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build ${{ github.run_number }} aus Commit ${{ github.sha }}."
            echo
            echo "Auf dem Tablet Wattwerk.apk herunterladen und installieren (Installation aus unbekannten Quellen erlauben)."
            echo
            echo "## Änderungen"
            echo
            git log -1 --pretty=%B "${{ github.sha }}" | sed 's/^Co-Authored-By.*//; s/^Claude-Session.*//'
          } > notes.md
          gh release create "v0.1.${{ github.run_number }}" Wattwerk.apk \
            --title "Wattwerk 0.1.${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Wattwerk.apk \
            --title "Wattwerk (immer der neueste Build ${{ github.run_number }})" \
            --notes-file notes.md \
            --prerelease
