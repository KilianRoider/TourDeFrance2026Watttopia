name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :core:test :app:assembleDebug 2>&1 | tee build.log

      # Compiler errors as annotations and as a commit comment, so they can be read without the raw log.
      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "^e: |What went wrong|^> Task .* FAILED|^\* What|tests completed" build.log | head -200 > errors.txt || true
          head -10 errors.txt | while IFS= read -r line; do echo "::error::${line}"; done
          {
            echo "Build ${{ github.run_number }} fehlgeschlagen (Run ${{ github.run_id }})."
            echo
            echo '```'
            cat errors.txt
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wattwerk.apk

      # On main, publish the APK as the "latest" release so it can be downloaded directly on the tablet.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Wattwerk.apk \
            --title "Wattwerk (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Tablet öffnen und Wattwerk.apk installieren." \
            --prerelease
